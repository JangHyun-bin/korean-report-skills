name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# 배포는 한 번에 하나만. 진행 중인 것을 취소하지 않는다.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install playwright
      - run: playwright install --with-deps chromium

      - name: 예시 문서 빌드
        run: |
          python examples/build_example.py
          for m in paper deck; do
            node skills/korean-report-doc/assets/mathbuild.js \
              "dist/example_${m}_raw.html" "dist/example_${m}.html" \
              --assets skills/korean-report-doc/assets
          done
          python examples/build_before_after.py
          node skills/korean-report-doc/assets/mathbuild.js \
            dist/ba_after_raw.html dist/ba_after.html \
            --assets skills/korean-report-doc/assets

      - name: PDF 함께 뽑기
        run: python scripts/qa.py dist/example_paper.html dist/example_deck.html --pdf

      - name: 사이트 구성
        run: |
          mkdir -p site
          cp dist/example_paper.html  site/paper.html
          cp dist/example_deck.html   site/deck.html
          cp dist/ba_after.html       site/before-after.html
          cp dist/ba_before.html      site/before.html
          cp dist/example_paper.pdf   site/paper.pdf
          cp dist/example_deck.pdf    site/deck.pdf
          cp docs/pages-index.html    site/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
